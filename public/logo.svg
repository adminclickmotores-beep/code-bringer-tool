<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <rect x="2" y="2" width="136" height="136" rx="30" fill="#242424"/>
  <!-- dial base arc -->
  <path d="M 28 92 A 48 48 0 1 1 112 92" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="butt"/>
  <!-- red zone: top-right segment -->
  <path d="M 96.5 48.5 A 48 48 0 0 1 112 92" fill="none" stroke="#E10600" stroke-width="13" stroke-linecap="butt"/>
  <!-- ticks -->
  <g stroke="#242424" stroke-width="5" stroke-linecap="butt">
    <line x1="36" y1="72" x2="46" y2="76"/>
    <line x1="46" y1="52" x2="53" y2="60"/>
    <line x1="70" y1="43.5" x2="70" y2="54"/>
    <line x1="94" y1="52" x2="87" y2="60"/>
  </g>
  <!-- needle pointing forward-right -->
  <line x1="70" y1="92" x2="103" y2="47.5" stroke="#E10600" stroke-width="12.5" stroke-linecap="butt"/>
  <!-- hub -->
  <circle cx="70" cy="92" r="15" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="5"/>
  <circle cx="70" cy="92" r="5" fill="#E10600"/>
</svg>
