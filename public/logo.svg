<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="50%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4757"/>
      <stop offset="50%" stop-color="#E53E3E"/>
      <stop offset="100%" stop-color="#c53030"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7FAFC"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#A0AEC0"/>
      <stop offset="100%" stop-color="#CBD5E0"/>
    </linearGradient>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E53E3E" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E53E3E" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with angled cut -->
  <path d="M16 8 L124 8 Q132 8 132 16 L132 124 Q132 132 124 132 L16 132 Q8 132 8 124 L8 16 Q8 8 16 8 Z" fill="url(#bgGrad)"/>
  <path d="M16 8 L124 8 Q132 8 132 16 L132 124 Q132 132 124 132 L16 132 Q8 132 8 124 L8 16 Q8 8 16 8 Z" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Diagonal speed accent bar -->
  <path d="M8 96 L132 52 L132 62 L8 106 Z" fill="url(#speedGrad)" opacity="0.12"/>

  <!-- Speed lines - left side -->
  <line x1="14" y1="34" x2="32" y2="34" stroke="#E53E3E" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="18" y1="44" x2="36" y2="44" stroke="#E53E3E" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="22" y1="54" x2="38" y2="54" stroke="#E53E3E" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>

  <!-- J letter - aggressive sport italic with hook -->
  <path d="M50 26 L72 26 L66 30 L62 70 Q60 82 46 82 Q34 82 30 72 L42 66 Q45 72 50 71 Q54 70 55 64 L59 30 Z"
        fill="url(#redGrad)" stroke="#E53E3E" stroke-width="0.5" filter="url(#glow)"/>

  <!-- J inner highlight -->
  <path d="M53 29 L68 29 L65 32 L62 66 Q61 73 53 73 Q48 73 45 69 L49 66 Q52 68 54 67 Q56 66 56 62 L58 32 Z"
        fill="none" stroke="#FF6B6B" stroke-width="0.5" opacity="0.4"/>

  <!-- G letter - aerodynamic ring with speed cut -->
  <path d="M80 26 Q100 24 106 40 L96 44 Q93 36 84 38 Q74 40 74 54 Q74 68 84 68 Q92 68 94 60 L86 60 L88 50 L108 50 L105 72 Q98 84 82 84 Q64 84 62 54 Q62 28 80 26 Z"
        fill="url(#chromeGrad)" stroke="#A0AEC0" stroke-width="0.5"/>

  <!-- G inner highlight -->
  <path d="M82 29 Q98 27 103 39 L99 41 Q96 35 86 37 Q76 39 76 54 Q76 65 84 65 Q90 65 92 60 L88 58 L89 53 L105 53 L103 70 Q97 80 83 80 Q68 80 66 54 Q66 30 82 29 Z"
        fill="none" stroke="#F7FAFC" stroke-width="0.5" opacity="0.3"/>

  <!-- Bottom red accent stripe -->
  <path d="M30 112 L110 112" stroke="url(#redGrad)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Red accent dot - racing emblem -->
  <circle cx="112" cy="112" r="5" fill="url(#redGrad)"/>
  <circle cx="112" cy="112" r="2.5" fill="#0a0a0a"/>

  <!-- Small chrome dot -->
  <circle cx="28" cy="112" r="3" fill="url(#chromeGrad)" opacity="0.6"/>
</svg>
