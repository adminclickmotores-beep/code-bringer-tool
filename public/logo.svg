<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <rect x="2" y="2" width="136" height="136" rx="30" fill="#121212"/>
  <rect x="2.75" y="2.75" width="134.5" height="134.5" rx="28.5" fill="none" stroke="#2B2B2B" stroke-width="1.5"/>
  <!-- estela de velocidad diagonal -->
  <path d="M10 92 L130 52 L130 62 L10 102 Z" fill="#DC2626" opacity="0.10"/>
  <!-- lineas de velocidad: largos distintos -->
  <g stroke-linecap="round" fill="none">
    <line x1="16" y1="46" x2="46" y2="46" stroke="#EF4444" stroke-width="7"/>
    <line x1="16" y1="65" x2="58" y2="65" stroke="#DC2626" stroke-width="7"/>
    <line x1="16" y1="84" x2="37" y2="84" stroke="#DC2626" stroke-width="6" opacity="0.55"/>
  </g>
  <!-- monograma CM -->
  <g transform="translate(56 28) skewX(-10)">
    <text x="0" y="62" font-family="'Plus Jakarta Sans','Arial Black',Arial,sans-serif" font-size="58" font-weight="800" font-style="italic" letter-spacing="-3" fill="#FFFFFF">C<tspan fill="#EF4444">M</tspan></text>
  </g>
  <!-- base: pista + emblema -->
  <rect x="24" y="112" width="66" height="7" rx="3.5" fill="#DC2626"/>
  <circle cx="112" cy="115" r="8" fill="#DC2626"/>
  <circle cx="112" cy="115" r="3.4" fill="#121212"/>
  <circle cx="28" cy="115" r="4" fill="#FFFFFF" opacity="0.55"/>
</svg>
