<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#121212"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#2B2B2B" stroke-width="1.5"/>
  <!-- lineas de velocidad: largos y opacidades distintas -->
  <g stroke-linecap="round" fill="none">
    <line x1="7" y1="21" x2="22" y2="21" stroke="#EF4444" stroke-width="3.6"/>
    <line x1="7" y1="30" x2="28" y2="30" stroke="#DC2626" stroke-width="3.6"/>
    <line x1="7" y1="39" x2="17.5" y2="39" stroke="#DC2626" stroke-width="3" opacity="0.55"/>
  </g>
  <!-- monograma CM en italica deportiva -->
  <g transform="translate(27 13) skewX(-10)">
    <text x="0" y="29" font-family="'Plus Jakarta Sans','Arial Black',Arial,sans-serif" font-size="26" font-weight="800" font-style="italic" letter-spacing="-1.5" fill="#FFFFFF">C<tspan fill="#EF4444">M</tspan></text>
  </g>
  <!-- base: linea de pista + punto rojo -->
  <rect x="7" y="49" width="31" height="3.6" rx="1.8" fill="#DC2626"/>
  <circle cx="52" cy="50.8" r="3.8" fill="#DC2626"/>
  <circle cx="52" cy="50.8" r="1.6" fill="#121212"/>
</svg>
