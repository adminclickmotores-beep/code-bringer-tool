<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#242424"/>
  <!-- dial base arc: thick, high contrast -->
  <path d="M 14 42 A 22 22 0 1 1 50 42" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="butt"/>
  <!-- red zone: top-right segment -->
  <path d="M 44.5 22.5 A 22 22 0 0 1 50 42" fill="none" stroke="#E10600" stroke-width="6.5" stroke-linecap="butt"/>
  <!-- ticks -->
  <g stroke="#242424" stroke-width="2.4" stroke-linecap="butt">
    <line x1="17.5" y1="33.5" x2="22.5" y2="35.5"/>
    <line x1="22" y1="24.5" x2="25.5" y2="28"/>
    <line x1="32" y1="20.5" x2="32" y2="25.5"/>
    <line x1="42" y1="24.5" x2="38.5" y2="28"/>
  </g>
  <!-- needle pointing forward-right -->
  <line x1="32" y1="42" x2="47.5" y2="22.5" stroke="#E10600" stroke-width="6" stroke-linecap="butt"/>
  <!-- hub -->
  <circle cx="32" cy="42" r="7" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="32" cy="42" r="2.4" fill="#E10600"/>
</svg>
